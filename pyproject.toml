[project]
name = "recut"
version = "0.1.0"
description = "Recut: turn a long video or podcast into vertical short clips with animated captions, YouTube chapters, show notes, a blog post and social posts. Local speech recognition on CPU, free LLMs, ffmpeg rendering, human review before anything is published."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Savchenko" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "mcp==2.3.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pydantic>=2.8",
    "pydantic-settings",
    "python-multipart",
    "pyyaml",
    "rapidfuzz>=3.9",
    "rich",
    "scipy>=1.13",
    "structlog",
    "typer",
    "uvicorn[standard]",
]

[project.optional-dependencies]
# Local speech recognition on CPU (faster-whisper `small`, int8). Without it, transcripts come from sidecar files.
asr = ["faster-whisper>=1.2"]
# Synthetic test talks: Kokoro-82M text-to-speech (ONNX, CPU) and slide rendering.
synth = ["kokoro-onnx>=0.5", "onnxruntime>=1.20", "pillow>=11"]

[dependency-groups]
dev = ["mypy", "pytest", "ruff", "types-pyyaml", "pillow>=11"]

[project.scripts]
recut = "recut.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "asr: needs faster-whisper and its model (skipped when not installed)",
    "slow: renders real video with ffmpeg (a few seconds each)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PIE", "RET", "TC"]
ignore = ["E501", "TC001", "TC002", "TC003", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body", "fastapi.File", "fastapi.Form", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["recut"]

[[tool.mypy.overrides]]
module = ["cv2.*", "faster_whisper.*", "kokoro_onnx.*", "onnxruntime.*", "scipy.*", "ctranslate2.*"]
ignore_missing_imports = true
